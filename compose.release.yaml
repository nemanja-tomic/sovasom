# Image references must contain immutable GHCR digests; deploy-host validates them.
services:
  db:
    image: postgres:19.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U office -d office']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: ${BACKEND_IMAGE:?Digest required}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?HTTPS origin required}
    secrets: [database_password]
    networks: [data, edge]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: ${WEB_IMAGE:?Digest required}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Public hostname required}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/index.html && wget -q -O /dev/null http://127.0.0.1:8080/ready']
      interval: 5s
      timeout: 3s
      retries: 30
secrets:
  database_password:
    file: ${SECRET_DIRECTORY:?External private directory required}/database-password
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  data: {internal: true}
  edge:
