name: Verify office application
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_DB: office
          POSTGRES_USER: office
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office -d office"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/check-public-config.py
      - name: Full backend unit and PostgreSQL integration suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://office:synthetic-ci-only@127.0.0.1:5432/office
        run: uv run --frozen pytest
      - run: npm ci
        working-directory: frontend
      - run: uv run --frozen ruff check
      - run: npm run format:check && npm run lint && npm run check-types && npm test && npm run build && npm run build-storybook
        working-directory: frontend
      - name: Storybook interactions and reviewed visual baselines
        run: >-
          docker run --rm --ipc=host
          -e CI=1 -e STORYBOOK_STATIC=1
          -v "$PWD:/work" -w /work/frontend
          mcr.microsoft.com/playwright:v1.65.1-noble
          node node_modules/@playwright/test/cli.js test --config playwright.components.config.ts
