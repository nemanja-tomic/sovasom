name: Verify encrypted recovery
on:
  push:
    branches: [main]
    paths:
      - "scripts/backup*.py"
      - "scripts/verify-backup.py"
      - "scripts/setup.py"
      - "backend/migrations/**"
      - "backend/office/setup.py"
      - "alembic.ini"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".tool-versions"
      - ".github/workflows/backup*.yml"
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
      - name: Install checksum-pinned age
        run: |
          curl --fail --silent --show-error --location https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz -o "$RUNNER_TEMP/age.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - name: Encrypted recovery on disposable PostgreSQL
        env:
          PYTHONPATH: backend
        run: uv run --frozen python scripts/verify-backup.py
